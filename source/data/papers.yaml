job_market_paper:
  title: "When Solar Energy Reaches the Poor: Evidence from Solar Expansion in China"
  authors: "Jingyao Wei"
  year: 2026
  status: "working paper"
  pdf: ""
  abstract: >-
    I study whether linking solar investment to poverty alleviation can reduce
    the local environmental costs of solar expansion in China. I use satellite
    data on 30,023 solar plants to study forest loss around nearby villages.
    Using a spatial difference-in-differences design, I estimate that annual
    forest loss near these villages rises by 7.7 percent after the first nearby
    plant appears in satellite imagery, relative to changes in forest farther
    away. The estimated increase is larger in lower-income counties. I then
    study China's Solar Energy Poverty Alleviation Program (SEPAP), which
    financed solar stations and assigned their revenues to poor households and
    villages. Using the same spatial design, I estimate a 10.7 percent decline
    in forest loss near host villages after the program began in 2014. To
    examine possible mechanisms, I use household panel data and a
    difference-in-differences design based on SEPAP county designation in 2014
    and 2016. The share of households reporting firewood as their main cooking
    fuel falls by about 7 percent, while the share reporting electricity rises
    by 46 percent. Children's reported respiratory illness also declines by
    about 17 percent, with no detectable changes in other reported diseases.
    This decline is larger among children who spent more time on household
    chores before designation. These patterns are consistent with reduced
    firewood reliance and lower exposure to indoor smoke. The findings suggest
    that solar development linked to poverty alleviation can benefit local
    forests and children's health.

published:
  - title: "Psychological Barriers to Participation in the Labor Market: Evidence from Rural Ghana"
    authors: "with Leandro Carvalho, Damien de Walque, Crick Lund, Heather Schofield, Vincent Somville"
    year: 2026
    status: "published"
    venue: "Journal of Development Economics, 181 (2026), 103734"
    url: ""
    pdf: "https://heatherschofield.net/wp-content/uploads/2026/02/carvalho-et-al-psych-barriers-to-participation-in-the-labor-market.pdf"
    coverage:
      - label: "VoxDev summary"
        url: "https://voxdev.org/topic/labour-markets/how-mental-health-affects-womens-labour-force-participation-ghana"
    abstract: >-
      Mental health conditions are strongly associated with lower labor market
      participation, but the underlying channels remain unclear. We conduct a
      two-phase study of women in rural Ghana to examine job take-up and work
      outcomes. In the first phase, we ask whether women would accept
      cash-for-work jobs during the lean season. Women with depression or
      anxiety are much more likely to decline work outside the home, but
      equally likely to accept work-from-home positions. In the second phase,
      we randomly offer home-based jobs to women willing to work from home.
      Neither depression nor anxiety predicts work completion, earnings, or
      quit rates. These findings suggest that barriers to accepting work
      outside the home help explain the association between mental health and
      labor market participation, and highlight home-based employment as a
      potential response.

working_papers:
  - title: "Heat, Economic Stress, and Mental Health: Evidence from Indonesia"
    authors: "with Simon Taye, Damien de Walque, Heather Schofield, Hao Wang"
    year: 2026
    status: "revise and resubmit"
    venue: "Revise and resubmit, Frontiers in Behavioral Economics"
    pdf: "/papers/wei-taye-dewalque-schofield-wang-heat-mental-health.pdf"
    abstract: >-
      Evidence on the relationship between heat and mental health varies across
      populations. We examine whether underlying economic stress explains this
      heterogeneity using panel data from Indonesia and three types of economic
      shocks: income losses driven by international palm oil price changes,
      sudden large increases in fuel costs, and job loss. In the general
      population, we find no association between temperature and depressive
      symptoms, measured using the CES-D scale, and can rule out even small
      harmful effects. Among those experiencing negative economic shocks,
      however, heat is associated with increases in depressive symptoms of
      0.044–0.09 standard deviations per degree Celsius. As climate change
      increases both the frequency of extreme heat and the prevalence of
      economic shocks, our findings suggest that the psychological toll of a
      warming climate will be concentrated among the most economically
      vulnerable.

