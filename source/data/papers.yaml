job_market_paper:
  title: "When Solar Reaches the Poor: Forest and Health Co-Benefits in Rural China"
  authors: "Jingyao Wei"
  year: 2026
  status: "working paper"
  pdf: ""
  abstract: >-
    Solar power is expanding into poor rural areas worldwide, yet little is known
    about what grid-connected solar does to the communities that host it beyond
    producing electricity. I study China's Solar Energy Poverty Alleviation
    Program, which built solar stations in designated poverty counties and
    assigned registered poor households as beneficiaries. Combining the program
    registry with satellite forest-loss data and a national household panel, I
    find that forest loss around host villages fell by roughly 13 percent during
    the program era, and that the probability a child's most serious recorded
    illness is respiratory fell by 11 percentage points, about 18 percent of the
    sample mean. Placebo illness categories and poverty counties without the
    program show no detected change. Satellite-detected solar plants outside the
    program show no comparable forest decline, suggesting that the
    poverty-campaign link, not the technology alone, drives the response. The
    local consequences of solar investment depend on where and how it is
    deployed.

published:
  - title: "Psychological Barriers to Participation in the Labor Market: Evidence from Rural Ghana"
    authors: "with Leandro Carvalho, Damien de Walque, Crick Lund, Heather Schofield, Vincent Somville"
    year: 2026
    status: "published"
    venue: "Journal of Development Economics, 2026, 103734"
    url: ""
    pdf: "https://heatherschofield.net/wp-content/uploads/2026/02/carvalho-et-al-psych-barriers-to-participation-in-the-labor-market.pdf"
    coverage:
      - label: "VoxDev summary"
        url: "https://voxdev.org/topic/labour-markets/how-mental-health-affects-womens-labour-force-participation-ghana"
    abstract: >-
      Mental health conditions are strongly associated with reduced labor market
      participation, but the underlying channels through which such conditions
      impact labor supply remain unclear. We conduct a two-phase study
      decomposing this relationship by examining (i) job take-up decisions,
      (ii) labor supply, output, and earnings conditional on job take-up, and
      (iii) quit rates. In Phase 1, women in rural Ghana are asked whether they
      would be willing to take up a cash-for-work job during the lean season
      when alternative work is scarce. We find that individuals with depression
      and anxiety, which are common in this population, are much more likely to
      decline work offers outside the home but equally likely to accept
      work-from-home positions. In Phase 2, we randomly offer jobs at home to
      those who were willing to work from home, avoiding selection effects.
      Neither depression nor anxiety predict work completion, income, or quit
      rates. These findings suggest that poor mental health may harm labor
      market outcomes in traditional jobs outside of the home via reduced
      take-up, above and beyond the established negative impacts of mental
      health on productivity in work outside of the home. But the results also
      suggest an alternative approach to improving labor market outcomes for
      those in poor mental health: work-from-home opportunities, which are not
      associated with lower take-up or lower productivity on the job for those
      in poor mental health.

working_papers:
  - title: "Heat, Economic Stress, and Mental Health: Evidence from Indonesia"
    authors: "with Simon Taye, Damien de Walque, Heather Schofield, Hao Wang"
    year: 2026
    status: "working paper"
    pdf: "/papers/wei-taye-dewalque-schofield-wang-heat-mental-health.pdf"
    abstract: >-
      The potential for heat to harm mental health is well-known, but
      inconsistent across populations. We explore a potential source of
      heterogeneity in this effect that may drive these conflicting results:
      underlying economic stress. We draw on panel data from Indonesia and
      capture three types of economic shocks: income losses driven by
      international price changes for palm oil, sudden and large fuel cost
      increases, and job loss. In the general population we find no association
      between temperature and depressive symptoms — captured via the CES-D
      scale — and are able to rule out even small harmful effects. But for
      those experiencing a negative economic shock, we find robust negative
      impacts of heat ranging from 0.044 to 0.09 SD per degree Celsius. As
      climate change increases both the frequency of extreme heat and the
      prevalence of economic shocks, our findings suggest the psychological
      toll of a warming climate will be concentrated among the most
      economically vulnerable.

